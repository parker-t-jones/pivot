# App name may already be taken on Fly — Parker can change `app` after `fly apps create`.
# See docs/D1-DEPLOY-RUNBOOK.md.
app = 'pivot-api'
primary_region = 'iad'

[build]

[processes]
  api = 'node dist/index.js'
  worker = 'node dist/worker.js'

[env]
  NODE_ENV = 'production'
  # GIT_SHA is set at image build time (Docker ARG) or via `fly deploy --build-arg`.

# HTTP only for the api process. Worker has no public port.
[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # API may scale to zero (cold start on first request / WS reconnect). Prefer 1 for TestFlight.
  min_machines_running = 0
  processes = ['api']

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

# Worker must not scale to zero (lineup sync every 5 minutes).
# Fly has no min_machines_running for non-HTTP process groups in fly.toml — after first deploy:
#   fly scale count worker=1
# Intention documented in the runbook: worker min_machines_running = 1.
[[restart]]
  policy = 'always'
  retries = 10
  processes = ['worker']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  processes = ['api']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
  processes = ['worker']
