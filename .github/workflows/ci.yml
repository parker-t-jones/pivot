# Gates on every pull request and on main: tests (against a local Supabase), typecheck, lint.
# Mirrors CLAUDE.md "Definition of done". Redis integration suites stay skipped (no Redis here),
# so the expected skip count is exactly 5.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # packageManager in package.json is pnpm@9.15.0. Node 22 matches the Dockerfile.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # publicGrants.test.ts shells out to psql against the local database.
      - name: Ensure psql
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      # Local stack only. Uses supabase/config.toml (project_id FantasyFocusApp) and applies
      # every migration, which also proves the migrations apply cleanly from scratch.
      - name: Start local Supabase
        run: pnpm exec supabase start

      # The two local-DB suites read services/api/.env and only run when SUPABASE_URL is a
      # loopback URL. These are the throwaway local stack's keys, not production secrets.
      - name: Write services/api/.env for the local stack
        run: |
          pnpm exec supabase status -o env > /tmp/supabase.env
          set -a; . /tmp/supabase.env; set +a
          {
            echo "SUPABASE_URL=${API_URL}"
            echo "SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY:-$SECRET_KEY}"
            echo "SUPABASE_JWT_SECRET=${JWT_SECRET}"
          } > services/api/.env

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm exec vitest run --reporter=default --reporter=json --outputFile=vitest-results.json

      # Fail on any skip beyond the 5 known Redis integration tests, so a suite that silently
      # stops running is caught, not just a suite that fails.
      - name: Check skip count
        run: |
          node -e '
            const r = require("./vitest-results.json");
            const skipped = (r.numPendingTests ?? 0) + (r.numTodoTests ?? 0);
            console.log(`passed=${r.numPassedTests} failed=${r.numFailedTests} skipped=${skipped}`);
            if (r.numFailedTests !== 0) process.exit(1);
            if (skipped !== 5) { console.error(`Expected exactly 5 skipped tests, got ${skipped}.`); process.exit(1); }
          '
